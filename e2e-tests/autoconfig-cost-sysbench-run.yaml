apiVersion: v1
kind: Pod
metadata:
  name: sysbench-run
spec:
  restartPolicy: Never
  containers:
    - name: sysbench
      image: perconalab/percona-server-mysql-operator:sysbench
      imagePullPolicy: Always
      resources:
        requests:
          cpu: "2"
          memory: 1Gi
      env:
        - name: MYSQL_USER
          value: root
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ps-cluster1-secrets
              key: root
        - name: MYSQL_HOST
          value: ps-cluster1-haproxy
        - name: TABLES
          value: "10"
        - name: SCALE
          value: "8"
        - name: THREADS
          value: "650"
        - name: WARMUP_SECONDS
          value: "120"
        - name: MEASURED_SECONDS
          value: "300"
      command: ["/bin/bash"]
      args:
        - -c
        - |
          set -euo pipefail

          cd ./sysbench-tpcc

          COMMON=(
            --db-driver=mysql
            --mysql-host="${MYSQL_HOST}"
            --mysql-user="${MYSQL_USER}"
            --mysql-password="${MYSQL_PASSWORD}"
            --mysql-db=sbtest
            --tables="${TABLES}"
            --scale="${SCALE}"
            --threads="${THREADS}"
            --force_pk=1
            --rand-type=uniform
            --db-ps-mode=disable
            --mysql-ignore-errors=all
            --report-interval=10
          )

          echo "=== WARMUP START $(date -u +%FT%TZ) ==="
          sysbench ./tpcc.lua "${COMMON[@]}" \
            --time="${WARMUP_SECONDS}" run >/dev/null 2>&1 || true

          echo "=== MEASURED START $(date -u +%FT%TZ) ==="
          sysbench ./tpcc.lua "${COMMON[@]}" \
            --time="${MEASURED_SECONDS}" run
          echo "=== MEASURED END $(date -u +%FT%TZ) ==="
