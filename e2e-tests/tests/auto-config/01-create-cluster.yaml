apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 10
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      get_cr \
          | yq eval '.spec.mysql.clusterType="async"' - \
          | yq eval '.spec.mysql.autoconfig.enabled=false' - \
          | kubectl -n "${NAMESPACE}" apply -f -
