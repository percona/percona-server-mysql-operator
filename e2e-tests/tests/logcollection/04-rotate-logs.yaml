apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 120
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      pod=$(get_mysql_pod_names logcollection | awk '{print $1}')

      # -f forces a rotation regardless of the age/size conditions in the config,
      # so the test does not have to wait for the cron schedule.
      kubectl -n "${NAMESPACE}" exec "${pod}" -c logrotate -- \
          logrotate -f -s /var/lib/mysql/log/logrotate.status \
          /opt/percona/logcollector/logrotate/conf.d/mysql.conf

      rotated=$(kubectl -n "${NAMESPACE}" exec "${pod}" -c logrotate -- \
          sh -c 'ls /var/lib/mysql/log/mysqld-error.log.1 >/dev/null 2>&1 && echo yes || echo no')

      kubectl create configmap -n "${NAMESPACE}" 04-rotate-logs --from-literal=rotated="${rotated}"
