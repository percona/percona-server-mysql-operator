apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 420
commands:
  - script: |-
      null
      ---
      null
      ---
      null
      ---
      set -o errexit
      set -o xtrace

      source ../../functions

      for pod in $(get_mysql_pod_names logcollection); do
          kubectl -n "${NAMESPACE}" get pod "${pod}" \
              -o jsonpath='{.spec.containers[*].name}' | grep -w logs
          kubectl -n "${NAMESPACE}" get pod "${pod}" \
              -o jsonpath='{.spec.containers[*].name}' | grep -w logrotate
      done

      kubectl -n "${NAMESPACE}" get configmap logcollection-log-collector-logrotate-config
