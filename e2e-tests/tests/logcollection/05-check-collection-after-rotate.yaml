apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      probe_user=kuttl-collect-probe

      collecting=0
      for pod in $(get_mysql_pod_names logcollection); do
          # A failed login makes mysqld write to the reopened log itself.
          if kubectl -n "${NAMESPACE}" exec "${pod}" -c logrotate -- \
              bash -c 'MYSQL_PWD=wrong mysql -nN -ukuttl-collect-probe -h"${POD_IP}" -P33062 -e "SELECT 1"' 2>/dev/null; then
              echo "probe login unexpectedly succeeded"
              exit 1
          fi

          retry 18 10 bash -c "
              kubectl -n '${NAMESPACE}' logs '${pod}' -c logs --tail=-1 \
                  | grep -q ${probe_user}
          "

          collecting=$((collecting + 1))
      done

      kubectl create configmap -n "${NAMESPACE}" 05-check-collection-after-rotate --from-literal=collecting="${collecting}"
