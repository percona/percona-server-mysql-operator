apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 10
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      kubectl -n "${NAMESPACE}" apply -f "${TEST_CONFIG_DIR}/extra-logrotate-config.yaml"

      get_cr \
          | yq eval '.spec.mysql.clusterType="group-replication"' - \
          | yq eval '.spec.mysql.size=3' - \
          | yq eval '.spec.mysql.affinity.antiAffinityTopologyKey="none"' - \
          | yq eval '.spec.proxy.router.enabled=true' - \
          | yq eval '.spec.proxy.haproxy.enabled=false' - \
          | yq eval '.spec.logcollector.enabled=true' - \
          | yq eval '.spec.logcollector.logRotate.extraConfig.name="extra-logrotate-config"' - \
          | kubectl -n "${NAMESPACE}" apply -f -
