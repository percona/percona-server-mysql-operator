apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 120
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      pod=$(get_mysql_pod_names logcollection | awk '{print $1}')

      present=$(kubectl -n "${NAMESPACE}" exec "${pod}" -c logrotate -- \
          sh -c 'test -f /opt/percona/logcollector/logrotate/conf.d/extra.conf && echo yes || echo no')

      kubectl create configmap -n "${NAMESPACE}" 05-check-extra-config --from-literal=present="${present}"
