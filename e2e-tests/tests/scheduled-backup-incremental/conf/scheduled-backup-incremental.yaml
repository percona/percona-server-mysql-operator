apiVersion: ps.percona.com/v1
kind: PerconaServerMySQL
metadata:
  name: scheduled-backup-incremental
spec:
  mysql:
    clusterType: async
    size: 3
    resources:
      limits:
        cpu: "1"
        memory: 2Gi
      requests:
        cpu: "1"
        memory: 2Gi
    volumeSpec:
      persistentVolumeClaim:
        resources:
          requests:
            storage: 30Gi

  proxy:
    haproxy:
      enabled: true
      size: 3
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 200m
          memory: 256Mi

  orchestrator:
    enabled: true
    size: 3

  backup:
    backoffLimit: 3
    storages:
      local-s3:
        type: s3
        s3:
          bucket: operator-testing
          credentialsSecret: s3-secret
          endpointUrl: http://s3-storage-all-in-one.<namespace>:8333
          region: us-east-1
          prefix: ps
