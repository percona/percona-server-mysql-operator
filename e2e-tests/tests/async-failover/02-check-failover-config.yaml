apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 600
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      cluster=$(get_cluster_name)

      # The spec has to reach the hook orchestrator actually runs, not just the
      # ConfigMap: the hook is what enforces the timeout and the policy.
      kubectl -n "${NAMESPACE}" rollout status sts "${cluster}-orc" --timeout=300s

      idx=0
      for pod in $(kubectl -n "${NAMESPACE}" get pods -l 'app.kubernetes.io/component=orchestrator' -o jsonpath='{.items[*].metadata.name}'); do
          kubectl -n "${NAMESPACE}" wait --for=condition=ready pod "${pod}" --timeout=120s

          hook=""
          catch_up=""
          retry=0
          until [[ -n ${hook} && ${hook} != "null" ]] || [[ ${retry} -ge 30 ]]; do
              sleep 5
              hook=$(kubectl -n "${NAMESPACE}" exec "${pod}" -c orchestrator -- \
                  jq -r '.PreFailoverProcesses[] | select(contains("orc-handler failover"))' \
                  /etc/orchestrator/config/orchestrator.conf.json || true)
              catch_up=$(kubectl -n "${NAMESPACE}" exec "${pod}" -c orchestrator -- \
                  jq -r '.ReasonableMaintenanceReplicationLagSeconds' \
                  /etc/orchestrator/config/orchestrator.conf.json || true)
              retry=$((retry + 1))
          done

          echo "${pod}: ${hook}"

          timeout_flag=no
          policy_flag=no
          echo "${hook}" | grep -q -- "-timeout 5m0s" && timeout_flag=yes
          echo "${hook}" | grep -q -- "-on-timeout ForceWithPossibleDataLoss" && policy_flag=yes

          kubectl -n "${NAMESPACE}" create configmap "02-check-failover-config-${idx}" \
              --from-literal=timeout="${timeout_flag}" \
              --from-literal=policy="${policy_flag}" \
              --from-literal=catch_up="${catch_up}"
          idx=$((idx + 1))
      done
    timeout: 600
