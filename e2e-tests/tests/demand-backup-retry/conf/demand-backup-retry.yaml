apiVersion: ps.percona.com/v1
kind: PerconaServerMySQL
metadata:
  name: demand-backup-retry
spec:
  mysql:
    clusterType: async
    size: 3
    volumeSpec:
      persistentVolumeClaim:
        resources:
          requests:
            storage: 7Gi

  proxy:
    haproxy:
      enabled: true
      size: 3

  orchestrator:
    enabled: true
    size: 3

  backup:
    allowParallel: false
    backoffLimit: 5
    startingDeadlineSeconds: 900
    suspendedDeadlineSeconds: 900
    storages:
      local-s3:
        type: s3
        s3:
          bucket: operator-testing
          credentialsSecret: s3-secret
          endpointUrl: http://s3-storage-all-in-one.<namespace>:8333
          region: us-east-1
