apiVersion: ps.percona.com/v1
kind: PerconaServerMySQL
metadata:
  name: demand-backup-retry
spec:
  mysql:
    clusterType: async
    size: 3
    resources:
      limits:
        cpu: "1"
        memory: 2Gi
      requests:
        cpu: "1"
        memory: 2Gi
    volumeSpec:
      persistentVolumeClaim:
        resources:
          requests:
            storage: 30Gi

  proxy:
    haproxy:
      enabled: true
      size: 3
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 200m
          memory: 256Mi

  orchestrator:
    enabled: true
    size: 3

  backup:
    backoffLimit: 5
    storages:
      spaces:
        type: s3
        s3:
          bucket: "operator-testing"
          credentialsSecret: do-spaces-secret
          endpointUrl: https://ams3.digitaloceanspaces.com
          region: ams3
          prefix: ps/demand-backup
