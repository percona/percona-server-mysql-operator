apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      pod=$(kubectl get ps-backup demand-backup-retry-suspended-deadline \
        -n "$NAMESPACE" -o jsonpath='{.status.backupSource}' | cut -d'.' -f1)
      kubectl delete pod "$pod" -n "$NAMESPACE" --force --grace-period=0

      kubectl patch ps demand-backup-retry -n "$NAMESPACE" --type=merge \
        -p '{"spec":{"pause":true}}'
      kubectl wait ps/demand-backup-retry -n "$NAMESPACE" \
        --for='jsonpath={.status.state}=paused' --timeout=90s
      kubectl wait ps-backup/demand-backup-retry-suspended-deadline \
        -n "$NAMESPACE" --for='jsonpath={.status.state}=Suspended' --timeout=30s
