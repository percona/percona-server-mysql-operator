apiVersion: ps.percona.com/v1
kind: PerconaServerMySQL
metadata:
  name: gr-cross-cluster-backup-dc1
spec:
  backup:
    backoffLimit: 3
    storages:
      local-s3:
        type: s3
        s3:
          bucket: operator-testing
          credentialsSecret: s3-secret
          endpointUrl: http://s3-storage-all-in-one.<namespace>:8333
          region: us-east-1
        containerOptions:
          env:
            - name: VERIFY_TLS
              value: "false"
          args:
            xbcloud:
              - "--insecure"
