apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - timeout: 30
    script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      sleep 60

      yq eval '.spec.mysqlshellRunner.image = strenv(IMAGE_MYSQL)' \
        "${TEST_CONFIG_DIR}/clusterset.yaml" \
        | kubectl -n "${NAMESPACE}" apply -f -
