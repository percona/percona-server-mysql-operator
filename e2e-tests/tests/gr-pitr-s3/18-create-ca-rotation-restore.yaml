apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      cluster_name=$(get_cluster_name)
      destination=$(kubectl -n "${NAMESPACE}" get ps-backup gr-pitr-s3-ca-rotation-base \
          -o jsonpath='{.status.destination}')
      pitr_date=$(kubectl -n "${NAMESPACE}" get configmap ca-rotation-pitr-date \
          -o jsonpath='{.data.date}')
      binlog_server_spec=$(kubectl -n "${NAMESPACE}" get ps "${cluster_name}" -o json \
          | jq -c '.spec.backup.pitr.binlogServer')

      echo '{}' \
          | yq eval '.apiVersion = "ps.percona.com/v1"' - \
          | yq eval '.kind = "PerconaServerMySQLRestore"' - \
          | yq eval '.metadata.name = "gr-pitr-s3-ca-rotation-restore"' - \
          | yq eval ".spec.clusterName = \"${cluster_name}\"" - \
          | yq eval ".spec.backupSource.destination = \"${destination}\"" - \
          | yq eval '.spec.backupSource.storage.type = "s3"' - \
          | yq eval '.spec.backupSource.storage.s3.bucket = "operator-testing"' - \
          | yq eval '.spec.backupSource.storage.s3.credentialsSecret = "s3-secret"' - \
          | yq eval ".spec.backupSource.storage.s3.endpointUrl = \"https://s3-storage-all-in-one.${NAMESPACE}:8443\"" - \
          | yq eval '.spec.backupSource.storage.s3.region = "us-east-1"' - \
          | yq eval '.spec.backupSource.storage.s3.caBundle.name = "s3-restore-ca-bundle-rotated"' - \
          | yq eval '.spec.backupSource.storage.s3.caBundle.key = "ca.crt"' - \
          | yq eval '.spec.pitr.type = "date"' - \
          | yq eval ".spec.pitr.date = \"${pitr_date}\"" - \
          | BINLOG_SERVER_SPEC="${binlog_server_spec}" yq eval '.spec.pitr.backupSource.binlogServer = env(BINLOG_SERVER_SPEC)' - \
          | yq eval '.spec.pitr.backupSource.binlogServer.storage.s3.caBundle.name = "s3-pitr-restore-ca-bundle-rotated"' - \
          | yq eval '.spec.pitr.backupSource.binlogServer.storage.s3.caBundle.key = "ca.crt"' - \
          | kubectl apply -n "${NAMESPACE}" -f -
    timeout: 180
