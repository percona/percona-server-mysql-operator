apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      cluster_name=$(get_cluster_name)

      rotate_s3_storage_tls "${cluster_name}"

      run_mysql \
          "INSERT myDB.myTable (id) VALUES (300001)" \
          "-h $(get_router_service "${cluster_name}")"

      # Allow the continuously running binlog server to upload the transaction
      # through the endpoint after both storage CA references have been rotated.
      sleep 60
      pitr_date=$(date -u '+%Y-%m-%d %H:%M:%S')
      kubectl create configmap -n "${NAMESPACE}" ca-rotation-pitr-date \
          --from-literal=date="${pitr_date}"

      echo '{}' \
          | yq eval '.apiVersion = "ps.percona.com/v1"' - \
          | yq eval '.kind = "PerconaServerMySQLBackup"' - \
          | yq eval '.metadata.name = "gr-pitr-s3-ca-rotation-post"' - \
          | yq eval ".spec.clusterName = \"${cluster_name}\"" - \
          | yq eval '.spec.storageName = "local-s3"' - \
          | kubectl apply -n "${NAMESPACE}" -f -
    timeout: 1200
