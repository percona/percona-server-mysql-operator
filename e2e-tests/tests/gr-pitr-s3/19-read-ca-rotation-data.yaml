apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      cluster_name=$(get_cluster_name)
      max_id=$(run_mysql "SELECT MAX(id) FROM myDB.myTable" "-h $(get_router_service "${cluster_name}")")

      kubectl create configmap -n "${NAMESPACE}" 19-read-ca-rotation-data \
          --from-literal=max_id="${max_id}"
    timeout: 180
