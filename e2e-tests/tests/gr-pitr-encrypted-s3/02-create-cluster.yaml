apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      get_cr \
          | yq eval '.spec.mysql.clusterType="group-replication"' - \
          | yq eval ".spec.mysql.size=3" - \
          | yq eval '.spec.mysql.vaultSecretName="vault-keyring-secret"' - \
          | yq eval ".spec.proxy.haproxy.enabled=false" - \
          | yq eval ".spec.proxy.router.enabled=true" - \
          | yq eval ".spec.proxy.router.size=3" - \
          | yq eval ".spec.backup.backoffLimit=3" - \
          | yq eval '.spec.backup.storages.local-s3.type="s3"' - \
          | yq eval '.spec.backup.storages.local-s3.s3.bucket="operator-testing"' - \
          | yq eval '.spec.backup.storages.local-s3.s3.credentialsSecret="s3-secret"' - \
          | yq eval ".spec.backup.storages.local-s3.s3.endpointUrl=\"http://s3-storage-all-in-one.${NAMESPACE}:8333\"" - \
          | yq eval '.spec.backup.storages.local-s3.s3.region="us-east-1"' - \
          | yq eval '.spec.backup.storages.local-s3.containerOptions.env[0].name="VERIFY_TLS"' - \
          | yq eval '.spec.backup.storages.local-s3.containerOptions.env[0].value="false"' - \
          | yq eval '.spec.backup.pitr.enabled=true' - \
          | yq eval '.spec.backup.pitr.binlogServer.size=1' - \
          | yq eval '.spec.backup.pitr.binlogServer.storage.s3.bucket="operator-testing"' - \
          | yq eval '.spec.backup.pitr.binlogServer.storage.s3.prefix="binlogs"' - \
          | yq eval '.spec.backup.pitr.binlogServer.storage.s3.credentialsSecret="s3-secret"' - \
          | yq eval ".spec.backup.pitr.binlogServer.storage.s3.endpointUrl=\"http://s3-storage-all-in-one.${NAMESPACE}:8333\"" - \
          | yq eval '.spec.backup.pitr.binlogServer.storage.s3.region="us-east-1"' - \
          | yq eval '.spec.backup.pitr.binlogServer.connectTimeout=10' - \
          | yq eval '.spec.backup.pitr.binlogServer.readTimeout=10' - \
          | yq eval '.spec.backup.pitr.binlogServer.writeTimeout=10' - \
          | yq eval '.spec.backup.pitr.binlogServer.idleTime=3' - \
          | yq eval '.spec.backup.pitr.binlogServer.rewriteFileSize="16K"' - \
          | yq eval '.spec.backup.pitr.binlogServer.checkpointInterval="10s"' - \
          | yq eval '.spec.backup.pitr.binlogServer.logLevel="debug"' - \
          | kubectl -n "${NAMESPACE}" apply -f -
