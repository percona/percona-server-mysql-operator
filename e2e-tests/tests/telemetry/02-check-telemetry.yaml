apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit

      source ../../functions

      echo "Waiting for telemetry to be sent..."

      # TELEMETRY_SCHEDULE is set to * * * * *, so we wait...
      sleep 120

      OPERATOR_POD=$(get_operator_pod)
      echo "Operator pod: $OPERATOR_POD"

      echo "Checking operator logs for telemetry reports..."

      REPORT_IDS=$(kubectl logs -n "${OPERATOR_NS:-$NAMESPACE}" "$OPERATOR_POD" | grep -oE '"report_id": "[^"]+"' | awk -F': ' '{print $2}' | tr -d '"' | head -n 10)

      if [[ -z "$REPORT_IDS" ]]; then
        echo "No report IDs found in operator logs"
        exit 1
      fi

      if kubectl logs -n "${OPERATOR_NS:-$NAMESPACE}" "$OPERATOR_POD" | grep -i "sending telemetry on cluster start"; then
        echo "Found telemetry report generation in logs for cluster start"
      else
        echo "Telemetry report generation not found"
        exit 1
      fi

      if kubectl logs -n "${OPERATOR_NS:-$NAMESPACE}" "$OPERATOR_POD" | grep -i "sending telemetry on schedule"; then
        echo "Found telemetry report generation in logs for schedule"
      else
        echo "Telemetry report generation not found"
        exit 1
      fi

      detected=$(detect_k8s_platform)
      case "$detected" in
        gke) expected_platform="kubernetes-gke" ;;
        eks) expected_platform="kubernetes-eks" ;;
        aks) expected_platform="kubernetes-aks" ;;
        digitalocean) expected_platform="kubernetes-doks" ;;
        openshift) expected_platform="openshift" ;;
        *) expected_platform="kubernetes-unknown" ;;
      esac
      echo "Expected telemetry platform metric: $expected_platform (detected: $detected)"

      for report_id in $REPORT_IDS; do
        report_data=$(get_telemetry_report_by_id ${PMM_TELEMETRY_TOKEN:?PMM_TELEMETRY_TOKEN env var is required} $report_id)
        if [[ -z $report_data ]]; then
          echo "failed to get telemetry server response for report $report_id"
          exit 1
        fi
        echo "Telemetry server response for report $report_id:"
        echo "$report_data" | jq .
        actual_platform=$(echo "$report_data" | jq -r '.[0].metrics[] | select(.[0] == "platform") | .[1]')
        if [[ -z $actual_platform || $actual_platform == "null" ]]; then
          echo "platform metric not found in report $report_id"
          exit 1
        fi
        if [[ $actual_platform != "$expected_platform" ]]; then
          echo "telemetry platform mismatch for report $report_id: got '$actual_platform', want '$expected_platform'"
          exit 1
        fi
        echo "verified report ID: $report_id (platform=$actual_platform)"
      done
