apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      cluster=$(get_cluster_name)
      uids_before=$(get_pod_uids "${cluster}" database)

      kubectl patch ps "${cluster}" -n "${NAMESPACE}" \
        --type='merge' \
        -p '{
          "spec": {
            "mysql": {
              "env": [
                {
                  "name": "ASYNC_SOURCE_RETRY_COUNT",
                  "value": "4"
                },
                {
                  "name": "ASYNC_SOURCE_CONNECT_RETRY",
                  "value": "70"
                }
              ]
            }
          }
        }'

      # the assert would pass on the status from before the restart
      wait_for_pods_restart "${cluster}" database "${uids_before}" 600
      wait_cluster_consistency_async "${cluster}" 3 3
    timeout: 1200
