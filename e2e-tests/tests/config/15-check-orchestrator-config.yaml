apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      cluster=$(get_cluster_name)

      # Every orchestrator pod must run with the merged custom configuration.
      idx=0
      deadline=$((SECONDS + 480))
      for pod in $(kubectl -n "${NAMESPACE}" get pods -l "app.kubernetes.io/component=orchestrator,app.kubernetes.io/instance=${cluster}" -o jsonpath='{.items[*].metadata.name}'); do
          kubectl -n "${NAMESPACE}" wait --for=condition=ready pod "${pod}" --timeout=120s

          forget_hours=""
          recovery_period=""
          lag_minutes=""
          until [[ ${forget_hours} == "3" && ${recovery_period} == "300" && ${lag_minutes} == "0" ]]; do
              if (( SECONDS >= deadline )); then
                  echo "Timed out waiting for ${pod} to use the updated orchestrator configuration" >&2
                  exit 1
              fi
              forget_hours=$(kubectl -n "${NAMESPACE}" exec "${pod}" -c orchestrator -- \
                  jq -r '.UnseenInstanceForgetHours' /etc/orchestrator/config/orchestrator.conf.json || true)
              recovery_period=$(kubectl -n "${NAMESPACE}" exec "${pod}" -c orchestrator -- \
                  jq -r '.RecoveryPeriodBlockSeconds' /etc/orchestrator/config/orchestrator.conf.json || true)
              # Reserved: the override above must never reach the merged config.
              lag_minutes=$(kubectl -n "${NAMESPACE}" exec "${pod}" -c orchestrator -- \
                  jq -r '.FailMasterPromotionOnLagMinutes' /etc/orchestrator/config/orchestrator.conf.json || true)
              if [[ ${forget_hours} != "3" || ${recovery_period} != "300" || ${lag_minutes} != "0" ]]; then
                  sleep 5
              fi
          done

          echo "${pod}: UnseenInstanceForgetHours=${forget_hours} RecoveryPeriodBlockSeconds=${recovery_period} FailMasterPromotionOnLagMinutes=${lag_minutes}"
          kubectl -n "${NAMESPACE}" create configmap "15-check-orchestrator-config-${idx}" \
              --from-literal=unseen_instance_forget_hours="${forget_hours}" \
              --from-literal=recovery_period_block_seconds="${recovery_period}" \
              --from-literal=fail_master_promotion_on_lag_minutes="${lag_minutes}"
          idx=$((idx + 1))
      done
    timeout: 600
