apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      cluster=$(get_cluster_name)

      wait_for_mysql_variable "${cluster}" max_connections 250 120 || true
      wait_for_mysql_variable "${cluster}" max_connect_errors 150 120 || true

      for pod in $(get_mysql_pod_names "${cluster}"); do
          echo "${pod}"
          kubectl exec -n "${NAMESPACE}" "${pod}" -c mysql -- cat /etc/my.cnf.d/node.cnf
      done

      kubectl create configmap -n "${NAMESPACE}" 07-check-config \
          --from-literal=max_connections="$(get_mysql_variable_on_pods "${cluster}" max_connections)" \
          --from-literal=max_connect_errors="$(get_mysql_variable_on_pods "${cluster}" max_connect_errors)"
    timeout: 420
