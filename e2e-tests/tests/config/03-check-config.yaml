apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      # SET GLOBAL has to reach every pod, not just the primary.
      cluster=$(get_cluster_name)
      wait_for_mysql_variable "${cluster}" max_connections 250 120 || true

      kubectl create configmap -n "${NAMESPACE}" 03-check-config \
          --from-literal=max_connections="$(get_mysql_variable_on_pods "${cluster}" max_connections)"
