apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      data=$(retry 10 5 run_mysql "SELECT * FROM myDB.myTable" "-h $(get_mysql_router_service $(get_cluster_name)) --connect-timeout=5")

      kubectl create configmap -n "${NAMESPACE}" 09-read-from-primary --from-literal=data="${data}"
