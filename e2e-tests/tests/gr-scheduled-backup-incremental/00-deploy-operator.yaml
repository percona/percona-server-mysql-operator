apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - timeout: 300
    script: |-
      set -o errexit
      set -o xtrace

      source ../../functions
      init_temp_dir # do this only in the first TestStep

      apply_s3_storage_secrets
      deploy_operator
      deploy_tls_cluster_secrets
      deploy_client
      if has_s3_storage; then
        deploy_s3_storage "10Gi"
      fi
