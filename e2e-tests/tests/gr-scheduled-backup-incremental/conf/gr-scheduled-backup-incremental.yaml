apiVersion: ps.percona.com/v1
kind: PerconaServerMySQL
metadata:
  name: gr-scheduled-backup-incremental
spec:
  mysql:
    clusterType: group-replication
    size: 3
    volumeSpec:
      persistentVolumeClaim:
        resources:
          requests:
            storage: 7Gi

  proxy:
    haproxy:
      enabled: false
    router:
      enabled: true
      size: 3

  orchestrator:
    enabled: true
    size: 3

  backup:
    backoffLimit: 3
    storages:
      local-s3:
        type: s3
        s3:
          bucket: operator-testing
          credentialsSecret: s3-secret
          endpointUrl: http://s3-storage-all-in-one.<namespace>:8333
          region: us-east-1
          prefix: ps
