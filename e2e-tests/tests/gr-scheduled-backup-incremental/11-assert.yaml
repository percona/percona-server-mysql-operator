apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 600
commands:
  - script: |-
      set -o errexit
      set -o pipefail

      source ../../functions

      cluster_name=$(get_cluster_name)
      mysql_host=$(get_router_service "${cluster_name}")
      restore_name="gr-scheduled-backup-incremental-restore-1"

      until kubectl wait --for=jsonpath='{.status.state}'=Succeeded "ps-restore/${restore_name}" -n "${NAMESPACE}"; do
        echo "Waiting for restore ${restore_name} to succeed"
        sleep 5
      done

      until kubectl wait --for=jsonpath='{.status.state}'=ready "ps/${cluster_name}" -n "${NAMESPACE}"; do
        echo "Waiting for cluster ${cluster_name} to be ready"
        sleep 5
      done

      verify_restored_data "${restore_name}" "${mysql_host}" \
        "02-gr-scheduled-backup-incremental-data" "conf/data-query-1.sql" "11-first-restored-data"
---
apiVersion: ps.percona.com/v1
kind: PerconaServerMySQLRestore
metadata:
  name: gr-scheduled-backup-incremental-restore-1
status:
  state: Succeeded
---
apiVersion: ps.percona.com/v1
kind: PerconaServerMySQL
metadata:
  name: gr-scheduled-backup-incremental
  finalizers:
    - percona.com/delete-mysql-pods-in-order
status:
  mysql:
    ready: 3
    size: 3
    state: ready
  router:
    ready: 3
    size: 3
    state: ready
  state: ready
