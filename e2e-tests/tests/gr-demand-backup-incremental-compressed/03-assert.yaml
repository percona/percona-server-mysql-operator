apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 300
resourceRefs:
- apiVersion: ps.percona.com/v1
  kind: PerconaServerMySQLBackup
  name: base-backup-compressed
  ref: bcp
assertAll:
- celExpr: bcp.status.state == "Succeeded"
  message: "Compressed base backup should be succeeded"

- celExpr: bcp.status.type == "full"
  message: "Compressed base backup should be a full backup"

- celExpr: bcp.status.compressed == true
  message: "Compressed base backup should have compressed=true in status"

- celExpr: has(bcp.status.size) && bcp.status.size != "" && bcp.status.size != "0B"
  message: "Compressed base backup size should be populated and non-zero when succeeded"

- celExpr: has(bcp.status.uncompressedSize) && bcp.status.uncompressedSize != "" && bcp.status.uncompressedSize != "0B"
  message: "Compressed base backup uncompressedSize should be populated and non-zero"

- celExpr: bcp.status.uncompressedSize != bcp.status.size
  message: "For compressed backups, uncompressedSize should differ from size"

