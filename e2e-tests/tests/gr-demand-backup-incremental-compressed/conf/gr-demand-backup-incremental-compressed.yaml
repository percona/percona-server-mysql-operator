apiVersion: ps.percona.com/v1
kind: PerconaServerMySQL
metadata:
  name: gr-demand-backup-incremental-compressed
spec:
  mysql:
    clusterType: group-replication
    size: 3

  proxy:
    haproxy:
      enabled: false
    router:
      enabled: true
      size: 3

  orchestrator:
    enabled: true
    size: 3

  backup:
    backoffLimit: 3
    storages:
      s3:
        type: s3
        s3:
          bucket: operator-testing
          credentialsSecret: s3-secret
          endpointUrl: http://s3-storage-all-in-one.<namespace>:8333
          region: us-east-1
        containerOptions:
          env:
            - name: VERIFY_TLS
              value: "false"
          args:
            xbcloud:
              - "--insecure"
