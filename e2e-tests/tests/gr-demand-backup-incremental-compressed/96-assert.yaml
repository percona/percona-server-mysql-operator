apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 300
commands:
  - script: |-
      set -o errexit

      until backups=$(kubectl get ps-backup -n "${NAMESPACE}" -o name) && [[ -z "${backups}" ]]; do
        echo "Waiting for the incremental backup chain to be deleted"
        sleep 5
      done
