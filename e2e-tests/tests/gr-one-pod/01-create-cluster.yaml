apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - timeout: 30
    script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      cr_name="${test_name}"
      create_service_accounts "${cr_name}" mysql router

      get_cr \
          | yq eval '.spec.mysql.clusterType="group-replication"' - \
          | yq eval ".spec.proxy.router.enabled=true" - \
          | yq eval ".spec.proxy.haproxy.enabled=false" - \
          | yq eval ".spec.unsafeFlags.mysqlSize=true" - \
          | yq eval ".spec.unsafeFlags.proxySize=true" - \
          | yq eval ".spec.mysql.size=1" - \
          | yq eval ".spec.mysql.serviceAccountName=\"${cr_name}-mysql\"" - \
          | yq eval ".spec.proxy.haproxy.enabled=false" - \
          | yq eval ".spec.proxy.router.size=1" - \
          | yq eval ".spec.proxy.router.serviceAccountName=\"${cr_name}-router\"" - \
          | yq eval '.spec.proxy.router.ports[0].name="rw-default"' - \
          | yq eval ".spec.proxy.router.ports[0].port=1111" - \
          | yq eval '.spec.proxy.router.ports[1].name="custom-port"' - \
          | yq eval ".spec.proxy.router.ports[1].port=2222" - \
          | yq eval ".spec.proxy.router.ports[1].targetPort=3333" - \
          | yq eval ".spec.orchestrator.enabled=false" - \
          | yq eval '.spec.backup.storages.local-s3.type="s3"' - \
          | yq eval '.spec.backup.storages.local-s3.s3.bucket="operator-testing"' - \
          | yq eval '.spec.backup.storages.local-s3.s3.credentialsSecret="s3-secret"' - \
          | yq eval ".spec.backup.storages.local-s3.s3.endpointUrl=\"http://s3-storage-all-in-one.${NAMESPACE}:8333\"" - \
          | yq eval '.spec.backup.storages.local-s3.s3.region="us-east-1"' - \
          | kubectl -n "${NAMESPACE}" apply -f -
