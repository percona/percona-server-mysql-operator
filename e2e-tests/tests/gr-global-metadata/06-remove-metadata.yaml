apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      get_cr \
        | yq eval '.spec.mysql.clusterType="group-replication"' - \
        | yq eval '.spec.mysql.configuration=strload("conf/mysql-config.txt")' - \
        | yq eval '.spec.proxy.haproxy.enabled=false' - \
        | yq eval '.spec.proxy.router.enabled=true' - \
        | yq eval '.spec.proxy.router.configuration=strload("conf/router-config.txt")' - \
        | yq eval '.spec.metadata.labels={}' - \
        | yq eval '.spec.metadata.annotations={}' - \
        | yq eval '.spec.backup.storages.local-s3.type="s3"' - \
        | yq eval '.spec.backup.storages.local-s3.s3.bucket="operator-testing"' - \
        | yq eval '.spec.backup.storages.local-s3.s3.credentialsSecret="s3-secret"' - \
        | yq eval ".spec.backup.storages.local-s3.s3.endpointUrl=\"http://s3-storage-all-in-one.${NAMESPACE}:8333\"" - \
        | yq eval '.spec.backup.storages.local-s3.s3.region="us-east-1"' - \
        | kubectl -n "${NAMESPACE}" apply -f -

      # Removing the metadata rolls the mysql and router pods. 06-assert can pass
      # on the stale ready status before the rollout starts, so wait for it here.
      cluster_name=$(get_cluster_name)
      kubectl -n "${NAMESPACE}" wait sts "${cluster_name}-mysql" --for=jsonpath='{.metadata.generation}'=4 --timeout=120s
      kubectl -n "${NAMESPACE}" wait deployment "${cluster_name}-router" --for=jsonpath='{.metadata.generation}'=4 --timeout=120s
      wait_for_sts_pods_updated "${cluster_name}-mysql" 600
      kubectl -n "${NAMESPACE}" rollout status deployment "${cluster_name}-router" --timeout=300s
    timeout: 900
