apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - timeout: 30
    script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      cr_name="${test_name}"
      create_service_accounts "${cr_name}" mysql haproxy orc

      get_cr \
          | yq eval '.spec.mysql.clusterType="async"' - \
          | yq eval ".spec.unsafeFlags.mysqlSize=true" - \
          | yq eval ".spec.unsafeFlags.proxySize=true" - \
          | yq eval ".spec.unsafeFlags.orchestratorSize=true" - \
          | yq eval ".spec.mysql.size=1" - \
          | yq eval ".spec.mysql.serviceAccountName=\"${cr_name}-mysql\"" - \
          | yq eval ".spec.proxy.haproxy.enabled=true" - \
          | yq eval ".spec.proxy.haproxy.size=1" - \
          | yq eval ".spec.proxy.haproxy.serviceAccountName=\"${cr_name}-haproxy\"" - \
          | yq eval ".spec.orchestrator.enabled=true" - \
          | yq eval ".spec.orchestrator.size=1" - \
          | yq eval ".spec.orchestrator.serviceAccountName=\"${cr_name}-orc\"" - \
          | yq eval '.spec.backup.storages.local-s3.type="s3"' - \
          | yq eval '.spec.backup.storages.local-s3.s3.bucket="operator-testing"' - \
          | yq eval '.spec.backup.storages.local-s3.s3.credentialsSecret="s3-secret"' - \
          | yq eval ".spec.backup.storages.local-s3.s3.endpointUrl=\"http://s3-storage-all-in-one.${NAMESPACE}:8333\"" - \
          | yq eval '.spec.backup.storages.local-s3.s3.region="us-east-1"' - \
          | kubectl -n "${NAMESPACE}" apply -f -
