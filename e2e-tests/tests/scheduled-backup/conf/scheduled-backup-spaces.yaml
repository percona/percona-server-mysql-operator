
apiVersion: ps.percona.com/v1
kind: PerconaServerMySQL
metadata:
  name: scheduled-backup
spec:
  mysql:
    clusterType: async
    size: 3
    autoConfig:
      enabled: true
      loadType: heavyWrites
    resources:
      limits:
        cpu: "2"
        memory: 4Gi
      requests:
        cpu: "1"
        memory: 2Gi
    volumeSpec:
      persistentVolumeClaim:
        resources:
          requests:
            storage: 30Gi

  proxy:
    haproxy:
      enabled: true
      size: 3
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 200m
          memory: 256Mi

  orchestrator:
    enabled: true
    size: 3

  backup:
    storages:
      local-s3:
        type: s3
        s3:
          bucket: operator-testing
          credentialsSecret: s3-secret
          endpointUrl: http://s3-storage-all-in-one.<namespace>:8333
          region: us-east-1
          prefix: ps/scheduled-backup
    
      spaces-1:
        type: s3
        verifyTLS: true
        s3:
          bucket: operator-testing
          credentialsSecret: do-spaces-secret
          endpointUrl: https://ams3.digitaloceanspaces.com
          region: ams3
          prefix: ps/scheduled-backup/spaces-1

      spaces-2:
        type: s3
        verifyTLS: true
        s3:
          bucket: operator-testing-nyc3
          credentialsSecret: do-spaces-secret
          endpointUrl: https://nyc3.digitaloceanspaces.com
          region: nyc3
          prefix: ps/scheduled-backup/spaces-2

      spaces-3:
        type: s3
        verifyTLS: true
        s3:
          bucket: operator-testing-sfo3
          credentialsSecret: do-spaces-secret
          endpointUrl: https://sfo3.digitaloceanspaces.com
          region: sfo3
          prefix: ps/scheduled-backup/spaces-3
