apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 600

resourceRefs:
- kind: PerconaServerMySQLClusterSet
  apiVersion: ps.percona.com/v1
  name: gr-cross-cluster
  ref: cs
assertAll:
- celExpr: >-
    !has(cs.metadata.annotations) ||
    !("percona.com/clusterset-rejoin-cluster" in cs.metadata.annotations)
  message: "rejoin annotation should be removed after successful rejoin"

commands:
  - script: |-
      set -o errexit
      set -o pipefail
      set -o xtrace

      source ../../functions
      mysql_user="-uroot -p'$(get_user_pass root test-secrets)'"

      status=$(get_clusterset_status "-h gr-cross-cluster-dc2-mysql-primary" "${mysql_user}")

      echo "${status}" | jq .
      echo "${status}" | jq -e '
          .status == "HEALTHY" and
          .primaryCluster == "grcrossclusterdc2" and
          .clusters.grcrossclusterdc1.clusterRole == "REPLICA" and
          .clusters.grcrossclusterdc1.globalStatus == "OK" and
          .clusters.grcrossclusterdc2.clusterRole == "PRIMARY" and
          .clusters.grcrossclusterdc2.globalStatus == "OK"
      '

      # Verify replication works after rejoin
      run_mysql \
          "INSERT INTO myDB.myTable (id) VALUES (100800)" \
          "-h $(get_haproxy_svc "gr-cross-cluster-dc2")" "${mysql_user}"

      sleep 30

      data=$(run_mysql "SELECT id FROM myDB.myTable WHERE id=100800" \
        "-h gr-cross-cluster-dc1-mysql-0.gr-cross-cluster-dc1-mysql" "${mysql_user}")
      [ "${data}" = "100800" ] || (echo "ERROR: expected 100800, got: ${data}" && exit 1)

      # Restore dc1 to size 3 and auto mode for subsequent steps
      kubectl patch -n "${NAMESPACE}" ps gr-cross-cluster-dc1 --type=merge \
        -p '{"spec":{"unsafeFlags":{"mysqlSize":false},"mysql":{"size":3,"bootstrap":{"mode":"auto"}}}}'
    timeout: 600

