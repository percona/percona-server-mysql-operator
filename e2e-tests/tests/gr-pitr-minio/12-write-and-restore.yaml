apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - timeout: 600
    script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      cluster_name=$(get_cluster_name)
      BINLOG_SERVER_IMAGE=$(kubectl get ps -n "${NAMESPACE}" "${cluster_name}" -o jsonpath='{.spec.backup.pitr.binlogServer.image}')

      run_mysql \
          "INSERT myDB.myTable (id) VALUES (200501)" \
          "-h $(get_router_service ${cluster_name})"

      sleep 120

      PITR_DATE_POST=$(date -u '+%Y-%m-%d %H:%M:%S')
      kubectl create configmap -n "${NAMESPACE}" pitr-date-post --from-literal=date="${PITR_DATE_POST}"

      echo '{}' \
          | yq eval '.apiVersion = "ps.percona.com/v1"' - \
          | yq eval '.kind = "PerconaServerMySQLRestore"' - \
          | yq eval '.metadata.name = "gr-pitr-minio-restore-post-failover"' - \
          | yq eval ".spec.clusterName = \"${cluster_name}\"" - \
          | yq eval '.spec.backupName = "gr-pitr-minio-backup-2"' - \
          | yq eval '.spec.pitr.force = true' - \
          | yq eval '.spec.pitr.type = "date"' - \
          | yq eval ".spec.pitr.date = \"${PITR_DATE_POST}\"" - \
          | yq eval ".spec.pitr.backupSource.binlogServer.image = \"${BINLOG_SERVER_IMAGE}\"" - \
          | yq eval '.spec.pitr.backupSource.binlogServer.size = 1' - \
          | yq eval '.spec.pitr.backupSource.binlogServer.storage.s3.bucket = "operator-testing"' - \
          | yq eval '.spec.pitr.backupSource.binlogServer.storage.s3.prefix = "binlogs"' - \
          | yq eval '.spec.pitr.backupSource.binlogServer.storage.s3.credentialsSecret = "minio-secret"' - \
          | yq eval ".spec.pitr.backupSource.binlogServer.storage.s3.endpointUrl = \"https://minio-service.${NAMESPACE}:9000\"" - \
          | yq eval '.spec.pitr.backupSource.binlogServer.storage.s3.region = "us-east-1"' - \
          | yq eval '.spec.pitr.backupSource.binlogServer.storage.s3.caBundle.name = "minio-pitr-restore-ca-bundle"' - \
          | yq eval '.spec.pitr.backupSource.binlogServer.storage.s3.caBundle.key = "ca.crt"' - \
          | yq eval '.spec.pitr.backupSource.binlogServer.connectTimeout = 10' - \
          | yq eval '.spec.pitr.backupSource.binlogServer.readTimeout = 10' - \
          | yq eval '.spec.pitr.backupSource.binlogServer.writeTimeout = 10' - \
          | yq eval '.spec.pitr.backupSource.binlogServer.idleTime = 3' - \
          | yq eval '.spec.pitr.backupSource.binlogServer.logLevel = "debug"' - \
          | kubectl apply -n "${NAMESPACE}" -f -
