apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 30
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      cluster_name=$(get_cluster_name)

      kubectl logs -n "${NAMESPACE}" -l job-name=pitr-restore-gr-pitr-minio-restore-post-failover --tail=-1 \
          | grep -E "GTID_EXECUTED|applying [0-9]+ binlog|streaming binlog|PITR complete" || true
      run_mysql "SELECT @@GLOBAL.gtid_executed" "-h $(get_router_service ${cluster_name})"

      for i in 0 1 2; do
          max_id=$(run_mysql "SELECT MAX(id) FROM myDB.myTable" "-h ${cluster_name}-mysql-${i}.${cluster_name}-mysql")
          orphan_rows=$(run_mysql "SELECT COUNT(*) FROM myDB.myTable WHERE id = 100600" "-h ${cluster_name}-mysql-${i}.${cluster_name}-mysql")
          kubectl create configmap -n "${NAMESPACE}" 13-read-data-${i} --from-literal=max_id="${max_id}" --from-literal=orphan_rows="${orphan_rows}"
      done
