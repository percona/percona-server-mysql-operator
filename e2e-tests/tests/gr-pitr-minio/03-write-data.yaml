apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      run_mysql \
          "CREATE DATABASE IF NOT EXISTS myDB; CREATE TABLE IF NOT EXISTS myDB.myTable (id int PRIMARY KEY)" \
          "-h $(get_router_service $(get_cluster_name))"

      run_mysql \
          "INSERT myDB.myTable (id) VALUES (100500)" \
          "-h $(get_router_service $(get_cluster_name))"
      echo "$(date -u "+%Y-%m-%d %H:%M:%S") UTC: inserted 100500"
