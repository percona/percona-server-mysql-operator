apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - timeout: 60
    script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      cluster_name=$(get_cluster_name)

      # a date older than the oldest archived binlog
      echo '{}' \
          | yq eval '.apiVersion = "ps.percona.com/v1"' - \
          | yq eval '.kind = "PerconaServerMySQLRestore"' - \
          | yq eval '.metadata.name = "gr-pitr-minio-restore-too-old"' - \
          | yq eval ".spec.clusterName = \"${cluster_name}\"" - \
          | yq eval '.spec.backupName = "gr-pitr-minio-backup-2"' - \
          | yq eval '.spec.pitr.type = "date"' - \
          | yq eval '.spec.pitr.date = "2000-01-01 00:00:00"' - \
          | kubectl apply -n "${NAMESPACE}" -f -

      # a date the binlog server would not be able to parse
      echo '{}' \
          | yq eval '.apiVersion = "ps.percona.com/v1"' - \
          | yq eval '.kind = "PerconaServerMySQLRestore"' - \
          | yq eval '.metadata.name = "gr-pitr-minio-restore-bad-date"' - \
          | yq eval ".spec.clusterName = \"${cluster_name}\"" - \
          | yq eval '.spec.backupName = "gr-pitr-minio-backup-2"' - \
          | yq eval '.spec.pitr.type = "date"' - \
          | yq eval '.spec.pitr.date = "01/01/2000 00:00"' - \
          | kubectl apply -n "${NAMESPACE}" -f -
