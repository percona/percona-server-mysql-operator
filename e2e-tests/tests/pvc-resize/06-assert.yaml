apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 600
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pvc-resize-mysql
status:
  replicas: 5
  readyReplicas: 5
---
apiVersion: ps.percona.com/v1
kind: PerconaServerMySQL
metadata:
  name: pvc-resize
status:
