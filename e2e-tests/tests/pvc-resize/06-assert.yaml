  phase: Bound
  capacity:
    storage: 11Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: datadir-pvc-resize-mysql-4
status:
  phase: Bound
  capacity:
    storage: 11Gi
