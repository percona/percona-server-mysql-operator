apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 420
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pvc-resize-mysql
status:
  replicas: 3
  readyReplicas: 3
---
apiVersion: ps.percona.com/v1
kind: PerconaServerMySQL
metadata:
  name: pvc-resize
status:
  mysql:
    ready: 3
    size: 3
  state: ready
---
# scaling down does not delete the claims of the removed replicas: they are left
# behind at the old size and are the reason a later resize used to loop
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: datadir-pvc-resize-mysql-3
status:
  phase: Bound
  capacity:
    storage: 11Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: datadir-pvc-resize-mysql-4
status:
  phase: Bound
  capacity:
    storage: 11Gi
