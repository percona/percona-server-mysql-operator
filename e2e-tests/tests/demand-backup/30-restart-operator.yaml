apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 300
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      cluster_name=$(get_cluster_name)

      kubectl -n "${NAMESPACE}" patch ps "$cluster_name" --type=merge -p '{"spec":{"pause":false}}'

      # Reconciling everything from scratch must not bring either restore back
      # to life on a cluster that is serving again.
      kubectl -n "${OPERATOR_NS:-$NAMESPACE}" rollout restart deployment/percona-server-mysql-operator
      kubectl -n "${OPERATOR_NS:-$NAMESPACE}" rollout status deployment/percona-server-mysql-operator --timeout=120s

      sleep 60

      kubectl -n "${NAMESPACE}" delete ps-backup stale-restore-backup --wait=true --timeout=300s
