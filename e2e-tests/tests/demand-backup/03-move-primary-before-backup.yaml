apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      cluster_name=$(get_cluster_name)
      primary_before="$(get_primary_from_label)"
      uids_before=$(get_pod_uids "${cluster_name}" database)

      # A smart update restarts the primary last, switching over to a replica first.
      kubectl -n "${NAMESPACE}" patch ps "${cluster_name}" --type merge \
          -p '{"spec":{"mysql":{"annotations":{"e2e/move-primary":"'"$(date +%s)"'"}}}}'

      wait_for_pods_restart "${cluster_name}" database "${uids_before}" 600
      wait_cluster_consistency_async "${test_name}" "3" "3"

      primary_after=$(wait_for_primary "changed:${primary_before}" 60)
      echo "Primary changed from ${primary_before} to ${primary_after}"
    timeout: 720
