apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      cluster_name=$(get_cluster_name)
      storage_name=$(kubectl get ps "$cluster_name" -n "$NAMESPACE" -o yaml \
        | yq '(.spec.backup.storages // {}) | keys | .[0]')

      run_backup demand-backup "$storage_name"
      run_backup demand-backup-second "$storage_name"
