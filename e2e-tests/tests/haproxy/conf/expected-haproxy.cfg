backend mysql-primary
  mode tcp
  option srvtcpka
  balance roundrobin
  option external-check
  external-check command /opt/percona/haproxy_check_primary.sh
server PRIMARY PRIMARY:3306 resolvers kubernetes inter 10000 rise 1 fall 2 check weight 1 on-marked-up shutdown-backup-sessions
server REPLICA REPLICA:3306 resolvers kubernetes inter 10000 rise 1 fall 2 check weight 1 backup
server REPLICA REPLICA:3306 resolvers kubernetes inter 10000 rise 1 fall 2 check weight 1 backup

backend mysql-replicas
  mode tcp
  option srvtcpka
  balance roundrobin
  option external-check
  external-check command /opt/percona/haproxy_check_replicas.sh
server REPLICA REPLICA:3306 resolvers kubernetes inter 10000 rise 1 fall 2 check weight 1
server REPLICA REPLICA:3306 resolvers kubernetes inter 10000 rise 1 fall 2 check weight 1

backend mysql-x
  mode tcp
  option srvtcpka
  balance roundrobin
  option external-check
  external-check command /opt/percona/haproxy_check_primary.sh
server PRIMARY PRIMARY:33060 resolvers kubernetes inter 10000 rise 1 fall 2 check weight 1 on-marked-up shutdown-backup-sessions
server REPLICA REPLICA:33060 resolvers kubernetes inter 10000 rise 1 fall 2 weight 1 backup track mysql-primary/SELF
server REPLICA REPLICA:33060 resolvers kubernetes inter 10000 rise 1 fall 2 weight 1 backup track mysql-primary/SELF

backend mysql-admin
  mode tcp
  option srvtcpka
  balance roundrobin
  option external-check
  external-check command /opt/percona/haproxy_check_primary.sh
server PRIMARY PRIMARY:33062 resolvers kubernetes inter 10000 rise 1 fall 2 check weight 1 on-marked-up shutdown-backup-sessions
server REPLICA REPLICA:33062 resolvers kubernetes inter 10000 rise 1 fall 2 weight 1 backup track mysql-primary/SELF
server REPLICA REPLICA:33062 resolvers kubernetes inter 10000 rise 1 fall 2 weight 1 backup track mysql-primary/SELF
