apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 240
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      primary_pod_from_label="$(get_primary_from_label)"

      kubectl -n "${NAMESPACE}" delete pod ${primary_pod_from_label}

      # the label and the haproxy backends both flap after the delete
      primary_pod_from_haproxy="$(wait_for_same_primary_from_haproxy "${test_name}" 3 120 "${primary_pod_from_label}")"
      wait_for_primary_label "${primary_pod_from_haproxy}"

      check_haproxy_backends "${test_name}"
    timeout: 240
