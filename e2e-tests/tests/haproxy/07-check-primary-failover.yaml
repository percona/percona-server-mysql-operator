apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 360
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      primary_pod_from_label="$(get_primary_from_label)"

      kubectl -n "${NAMESPACE}" delete pod ${primary_pod_from_label}
      sleep 3

      data=()
      for i in $(seq 0 2); do
          data+=("$(get_primary_from_haproxy ${test_name}-haproxy-$i)")
      done
      if [ "${data[0]}" != "${data[1]}" -o "${data[1]}" != "${data[2]}" ]; then
          echo "Not all haproxy pods point to same primary: 0: ${data[0]} 1: ${data[1]} 2: ${data[2]}"
          exit 1
      fi

      primary_pod_from_label="$(get_primary_from_label)"
      if [ "${primary_pod_from_label}" != "${data[0]}" ]; then
          echo "Primary in k8s label (${primary_pod_from_label}) is not set to same pod as in haproxy (${data[0]})!"
          exit 1
      fi

      check_haproxy_backends "${test_name}" "${primary_pod_from_label}"
    timeout: 360
