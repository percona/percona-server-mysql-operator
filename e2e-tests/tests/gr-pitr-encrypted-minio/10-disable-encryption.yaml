apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      cluster=$(get_cluster_name)

      # stop encrypting new binlogs but keep the keyring: the storage still holds
      # binlogs encrypted with alpha and beta that the binlog server must read
      kubectl -n "${NAMESPACE}" patch ps "${cluster}" \
          --type merge \
          -p '{"spec": {"backup": {"pitr": {"binlogServer": {"storage": {"encryption": null}}}}}}'
