apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - timeout: 240
    script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      deploy_pmm_server
      TOKEN=$(get_pmm_server_token)
      kubectl patch -n "${NAMESPACE}" secret test-secrets --type merge --patch "$(jq -n --arg token "$TOKEN" '{"stringData": {"pmmservertoken": $token}}')"
