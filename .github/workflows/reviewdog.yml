name: reviewdog
on: [pull_request]
jobs:
  golangci-lint:
    name: runner / suggester / golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '^1.27'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
          only-new-issues: true
          args: --timeout 5m


  gofmt:
    name: runner / suggester / gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: gofmt -w -s $(find . -not -path "*/vendor/*" -name "*.go")
      - uses: reviewdog/action-suggester@c387862ad6765a9729f2b40ee4d8b5769f2145c7 # v1.26.1
        with:
          tool_name: gofmt

  shfmt:
    name: runner / suggester / shfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: '^1.27'
      - run: go install mvdan.cc/sh/v3/cmd/shfmt@latest
      - run: $(go env GOPATH)/bin/shfmt -f . | grep -v 'vendor' | xargs $(go env GOPATH)/bin/shfmt -bn -ci -s -w
      - name: suggester / shfmt
        uses: reviewdog/action-suggester@c387862ad6765a9729f2b40ee4d8b5769f2145c7 # v1.26.1
        with:
          tool_name: shfmt

  shellcheck:
    if: github.event_name == 'pull_request'
    name: runner / shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: reviewdog/action-shellcheck@0a90156c6e0553996a217f0a9e09be6b0f6bee4c # v1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-check
          shellcheck_flags: -e SC2155 --external-sources
          exclude: "./vendor/*"

  misspell:
    name: runner / misspell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: reviewdog/action-misspell@7cea3d501cb3834c688e08c89ed77b71764d1784 # 1.30.1
        with:
          github_token: ${{ secrets.github_token }}
          locale: "US"
          reporter: github-pr-check
          exclude: "./vendor/*"

  alex:
    name: runner / alex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: reviewdog/action-alex@a86fdb2da29e06d659cd3bd528095479a2c5c01e # v1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          level: info

  manifests:
    name: runner / manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: '^1.27'
      - name: check on release branch
        if: |
          startsWith(github.base_ref, 'security/') ||
          (startsWith(github.base_ref, 'release-') && !startsWith(github.head_ref, 'after-release-'))
        run: |
          OPERATOR_IMAGE="$(sed -n 's/^IMAGE_OPERATOR=//p' e2e-tests/release_versions)"
          make release VERSION="$(cat pkg/version/version.txt)" IMAGE="$OPERATOR_IMAGE"
          git diff --exit-code
      - name: check on non release branches
        if: |
          !startsWith(github.base_ref, 'security/') &&
          (!startsWith(github.base_ref, 'release-') || startsWith(github.head_ref, 'after-release-'))
        run: |
          make generate manifests VERSION=main
          git diff --exit-code

  e2e-release-versions-images:
    name: e2e-tests release_versions image availability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check if e2e-tests/release_versions changed
        id: changed
        run: |
          git fetch origin ${{ github.base_ref }}
          if git diff --name-only origin/${{ github.base_ref }}...HEAD -- e2e-tests/release_versions | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify release_versions images exist (docker manifest inspect)
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -e
          # All IMAGE_*=value lines, exclude operator image (percona/percona-server-mysql-operator)
          images=$(grep -E '^IMAGE_[^=]+=' e2e-tests/release_versions | cut -d= -f2 | grep -v '^$' | grep -v 'percona/percona-server-mysql-operator' | sort -u)
          if [ -z "$images" ]; then
            echo "No non-operator images found in e2e-tests/release_versions"
            exit 0
          fi
          failed=""
          for img in $images; do
            echo "Checking image $img"
            if ! docker manifest inspect "$img"; then
              echo "::error::Image not found or inaccessible: $img"
              failed="${failed} ${img}"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::The following images failed docker manifest inspect:$failed"
            exit 1
          fi
          echo "All images are available."
