/var/lib/mysql/log/*.log {
    daily
    minsize 10M
    maxsize 100M
    rotate 7
    missingok
    nocompress
    notifempty
    nocreate
    sharedscripts
    postrotate
        /opt/percona/logcollector/logrotate/postrotate-mysql.sh
    endscript
}

/var/log/xtrabackup/*.log {
    daily
    maxsize 100M
    rotate 7
    missingok
    nocompress
    notifempty
    copytruncate
    sharedscripts
}
