# MySQL server logs, written to the log directory on the data volume
# (/var/lib/mysql/log). mysqld keeps the error log file open, so rotate with
# copytruncate rather than renaming it out from under the running server.
/var/lib/mysql/log/*.log {
    daily
    maxsize 100M
    rotate 7
    missingok
    nocompress
    notifempty
    copytruncate
    sharedscripts
}

# xtrabackup sidecar logs on MySQL instance pods.
/var/log/xtrabackup/*.log {
    daily
    maxsize 100M
    rotate 7
    missingok
    nocompress
    notifempty
    copytruncate
    sharedscripts
}
