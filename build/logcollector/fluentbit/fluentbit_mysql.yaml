service:
  flush: 1
  log_level: error
  daemon: off
  parsers_file: /opt/percona/logcollector/fluentbit/parsers_multiline.conf
  http_server: on
  http_listen: 0.0.0.0
  http_port: 2020

pipeline:
  inputs:
    - name: tail
      path: ${LOG_DIR}/*.log,${LOG_DIR}/*.err
      tag: ${POD_NAMESPACE}.${POD_NAME}.mysql
      multiline.parser: multiline-regex-test
      refresh_interval: 5
      db: ${LOG_DIR}/fluentbit/flb_mysql_${FLB_DB_VER}.db
      ignore_older: 1d
      read_from_head: true
      path_key: file
      skip_long_lines: on

    - name: tail
      path: ${XTRABACKUP_LOG_DIR}/*.log
      tag: ${POD_NAMESPACE}.${POD_NAME}.xtrabackup
      multiline.parser: multiline-regex-test
      refresh_interval: 5
      db: ${LOG_DIR}/fluentbit/flb_xtrabackup_${FLB_DB_VER}.db
      ignore_older: 1d
      read_from_head: true
      path_key: file
      skip_long_lines: on

  outputs:
    - name: stdout
      match: '*'
      format: json_lines
      json_date_key: false
